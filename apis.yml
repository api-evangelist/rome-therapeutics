name: Rome Therapeutics
description: >-
  Rome Therapeutics is a Cambridge, Massachusetts biotechnology company developing
  therapies that target the "repeatome" — the vast repetitive, non-coding regions of
  the human genome (the "dark genome," including LINE-1 and other transposable elements)
  implicated in cancer and autoimmune disease. Its discovery engine pairs ROMEMap, a
  proprietary high-resolution database of annotated functional repeats, with ROMEQuant,
  a machine-learning method for quantifying repeat expression and prioritizing targets
  and biomarkers. Backed by a16z and GV, the company raised a $77M Series B (2021) plus
  a $72M Series B extension to advance its lead program into clinical development. These
  are internal research/data-science tools; the company publishes no public developer or
  web API. This profile was surfaced as a VC portfolio lead and enriched by the pipeline.
